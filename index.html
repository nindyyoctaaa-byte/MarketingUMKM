        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgCol = type === 'success' ? 'bg-darkgreen text-white' : type === 'error' ? 'bg-red-600 text-white' : 'bg-sage text-darktext';
            toast.className = `${bgCol} px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center space-x-2 pointer-events-auto transform transition-all duration-300 translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${type==='success'?'fa-circle-check':'fa-circle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- 2. RENDER ROUTER ---
        function renderApp() {
            const user = getCurrentUser();

            if (!user) {
                if (currentView === 'register') {
                    app.innerHTML = renderRegisterView();
                } else {
                    currentView = 'login';
                    app.innerHTML = renderLoginView();
                }
                attachLoginEvents();
                return;
            }

            // Routed based on role
            if (user.role === 'customer') {
                if (!['customer_market', 'customer_detail', 'customer_cart', 'customer_checkout', 'customer_history', 'customer_profile'].includes(currentView)) {
                    currentView = 'customer_market';
                }
                app.innerHTML = renderCustomerLayout(renderCustomerContent());
                attachCustomerEvents();
            } else if (user.role === 'seller') {
                if (!['seller_dashboard', 'seller_products', 'seller_orders', 'seller_sales', 'seller_finance', 'seller_marketing', 'seller_development', 'seller_reviews', 'seller_profile'].includes(currentView)) {
                    currentView = 'seller_dashboard';
                }
                app.innerHTML = renderSellerLayout(renderSellerContent());
                attachSellerEvents();
            } else if (user.role === 'admin') {
                if (!['admin_dashboard', 'admin_umkm', 'admin_products', 'admin_transactions'].includes(currentView)) {
                    currentView = 'admin_dashboard';
                }
                app.innerHTML = renderAdminLayout(renderAdminContent());
                attachAdminEvents();
            }
        }

        function attachLoginEvents() {
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = document.getElementById('login-email').value.trim();
                    const pass = document.getElementById('login-password').value.trim();
                    const users = getUsers();
                    const found = users.find(u => u.email === email && u.password === pass);
                    if (found) {
                        setCurrentUser(found);
                        showToast(`Berhasil masuk sebagai ${found.name} (${found.role.toUpperCase()})!`, 'success');
                        if (found.role === 'customer') currentView = 'customer_market';
                        else if (found.role === 'seller') currentView = 'seller_dashboard';
                        else if (found.role === 'admin') currentView = 'admin_dashboard';
                        renderApp();
                    } else {
                        showToast('Email atau password salah!', 'error');
                    }
                });
            }

            const toReg = document.getElementById('to-register');
            if (toReg) {
                toReg.addEventListener('click', () => { currentView = 'register'; renderApp(); });
            }

            const toLogin = document.getElementById('to-login');
            if (toLogin) {
                toLogin.addEventListener('click', () => { currentView = 'login'; renderApp(); });
            }

            const regRole = document.getElementById('reg-role');
            if (regRole) {
                regRole.addEventListener('change', (e) => {
                    const sellerFields = document.getElementById('seller-fields');
                    if (e.target.value === 'seller') sellerFields.classList.remove('hidden');
                    else sellerFields.classList.add('hidden');
                });
            }

            const regForm = document.getElementById('register-form');
            if (regForm) {
                regForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const role = document.getElementById('reg-role').value;
                    const name = document.getElementById('reg-name').value.trim();
                    const phone = document.getElementById('reg-phone').value.trim();
                    const email = document.getElementById('reg-email').value.trim();
                    const password = document.getElementById('reg-password').value.trim();
                    const address = document.getElementById('reg-address').value.trim();

                    const users = getUsers();
                    if (users.some(u => u.email === email)) {
                        showToast('Email sudah terdaftar!', 'error');
                        return;
                    }

                    const newUser = {
                        id: 'u_' + Date.now(),
                        name, email, password, role, phone, address
                    };

                    if (role === 'seller') {
                        newUser.umkmName = document.getElementById('reg-umkm-name').value.trim() || `${name} Store`;
                        newUser.umkmCategory = document.getElementById('reg-umkm-category').value;
                        newUser.umkmDesc = document.getElementById('reg-umkm-desc').value.trim() || 'Produk lokal berkualitas tinggi buatan UMKM Indonesia.';
                    }

                    users.push(newUser);
                    setUsers(users);
                    setCurrentUser(newUser);
                    showToast('Akun berhasil dibuat! Selamat datang di LOCALIN.', 'success');
                    if (role === 'customer') currentView = 'customer_market';
                    else if (role === 'seller') currentView = 'seller_dashboard';
                    renderApp();
                });
            }

        function addToCart(productId) {
            const cart = getCart();
            const found = cart.find(i => i.productId === productId);
            if (found) found.qty += 1;
            else cart.push({ productId, qty: 1 });
            setCart(cart);
            showToast('Produk berhasil ditambahkan ke keranjang! 🛍️', 'success');
            renderApp();
        }

        function updateCartQty(productId, qty) {
            let cart = getCart();
            if (qty <= 0) {
                cart = cart.filter(i => i.productId !== productId);
            } else {
                const found = cart.find(i => i.productId === productId);
                if (found) found.qty = qty;
            }
            setCart(cart);
            renderApp();
        }

        function toggleWishlist(productId) {
            let wishlist = getWishlist();
            if (wishlist.includes(productId)) {
                wishlist = wishlist.filter(id => id !== productId);
                showToast('Dihapus dari wishlist.', 'info');
            } else {
                wishlist.push(productId);
                showToast('Ditambahkan ke wishlist! ❤️', 'success');
            }
            setWishlist(wishlist);
        }

        function processCheckout(total) {
            const cart = getCart();
            const products = getProducts();
            const user = getCurrentUser();
            if (cart.length === 0) return;

            const items = cart.map(i => {
                const p = products.find(x => x.id === i.productId);
                return { productId: i.productId, name: p ? p.name : 'Produk', price: p ? p.price : 0, qty: i.qty };
            });

            const newOrder = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                customerId: user.id,
                customerName: user.name,
                sellerId: 'u2',
                items,
                total,
                status: 'Diproses',
                date: new Date().toISOString().split('T')[0],
                shipping: 'Reguler',
                address: document.getElementById('checkout-address').value
            };

            const orders = getOrders();
            orders.unshift(newOrder);
            setOrders(orders);
            setCart([]);
            showToast('Pesanan berhasil dibuat! Terima kasih telah mendukung UMKM.', 'success');
            currentView = 'customer_history';
            renderApp();
        }

        function switchRoleToSeller() {
            const users = getUsers();
            const seller = users.find(u => u.role === 'seller');
            if (seller) {
                setCurrentUser(seller);
                currentView = 'seller_dashboard';
                renderApp();

        function updateOrderStatus(orderId, status) {

            if (ord) {

                showToast(`Status pesanan ${orderId} diperbarui menjadi ${status}.`, 'success');

        function replyReview(reviewId) {
            const replyText = document.getElementById(`reply-${reviewId}`).value.trim();
            if (!replyText) return;
            let reviews = getReviews();
            const r = reviews.find(x => x.id === reviewId);
            if (r) {
                r.reply = replyText;
                setReviews(reviews);
                showToast('Balasan ulasan berhasil dikirim!', 'success');
                renderApp();
            }
        }

                        </div>

                        <nav class="space-y-1">
                            <button onclick="adminTab='dashboard'; renderApp();" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${adminTab === 'dashboard' ? 'bg-sage text-darktext' : 'text-gray-300 hover:bg-white/10'}"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard Admin</span></button>
                            <button onclick="adminTab='umkm'; renderApp();" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${adminTab === 'umkm' ? 'bg-sage text-darktext' : 'text-gray-300 hover:bg-white/10'}"><i class="fa-solid fa-store w-5"></i><span>Kelola UMKM</span></button>
                            <button onclick="adminTab='products'; renderApp();" class="w-full flex items-center space-x-3 px-4 py-3 rounded-2xl text-sm font-bold transition ${adminTab === 'products' ? 'bg-sage text-darktext' : 'text-gray-300 hover:bg-white/10'}"><i class="fa-solid fa-box w-5"></i><span>Moderasi Produk</span></button>
                        </nav>
                    </div>

                    <div class="pt-6 border-t border-white/10">
                        <button onclick="logout()" class="w-full py-3 bg-red-600 text-white rounded-xl font-bold text-sm hover:bg-red-700 transition">Keluar Admin</button>
                    </div>
                </aside>

                <main class="flex-1 p-6 md:p-10 overflow-y-auto">
                    ${content}
                </main>
            </div>`;
        }

        function renderAdminContent() {
            const users = getUsers();
            const products = getProducts();
            const orders = getOrders();
            const totalOmzet = orders.reduce((a,c) => a + c.total, 0);

            if (adminTab === 'umkm') {
                const sellers = users.filter(u => u.role === 'seller');
                return `
                <div class="fade-in space-y-6">
                    <h1 class="text-2xl font-extrabold text-darktext">Kelola & Verifikasi UMKM</h1>
                    <div class="bg-white rounded-3xl border border-softgray overflow-hidden">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-cream border-b border-softgray text-xs font-bold uppercase text-darktext">
                                    <th class="p-4">Nama UMKM</th>
                                    <th class="p-4">Pemilik</th>
                                    <th class="p-4">Kategori</th>
                                    <th class="p-4">Kontak</th>
                                    <th class="p-4 text-center">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-softgray">
                                ${sellers.map(s => `
                                    <tr>
                                        <td class="p-4 font-bold text-darktext">${s.umkmName || 'Toko'}</td>
                                        <td class="p-4">${s.name}</td>
                                        <td class="p-4">${s.umkmCategory || 'Umum'}</td>
                                        <td class="p-4">${s.phone}</td>
                                        <td class="p-4 text-center"><span class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">Terverifikasi</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            }

            if (adminTab === 'products') {
                return `
                <div class="fade-in space-y-6">
                    <h1 class="text-2xl font-extrabold text-darktext">Moderasi Katalog Produk</h1>
                    <div class="bg-white rounded-3xl border border-softgray overflow-hidden">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-cream border-b border-softgray text-xs font-bold uppercase text-darktext">
                                    <th class="p-4">Produk</th>
                                    <th class="p-4">UMKM</th>
                                    <th class="p-4">Harga</th>
                                    <th class="p-4">Status</th>
                                    <th class="p-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-softgray">
                                ${products.map(p => `
                                    <tr>
                                        <td class="p-4 font-bold text-darktext">${p.name}</td>
                                        <td class="p-4">${p.umkmName}</td>
                                        <td class="p-4 font-extrabold text-darkgreen">Rp ${p.price.toLocaleString('id-ID')}</td>
                                        <td class="p-4"><span class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">${p.status}</span></td>
                                        <td class="p-4 text-center">
                                            <button onclick="showToast('Produk dimoderasi.', 'success')" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-lg text-xs font-bold">Tolak/Nonaktifkan</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            }

            return `
            <div class="fade-in space-y-8">
                <h1 class="text-2xl font-extrabold text-darktext">Dashboard Administrator LOCALIN 📊</h1>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="bg-white p-6 rounded-3xl border border-softgray shadow-sm space-y-2">
                        <div class="text-xs font-bold text-gray-400 uppercase">Total UMKM Terdaftar</div>
                        <div class="text-2xl font-extrabold text-darkgreen">${users.filter(u=>u.role==='seller').length + 5}</div>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-softgray shadow-sm space-y-2">
                        <div class="text-xs font-bold text-gray-400 uppercase">Total Pelanggan</div>
                        <div class="text-2xl font-extrabold text-darktext">${users.filter(u=>u.role==='customer').length + 124}</div>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-softgray shadow-sm space-y-2">
                        <div class="text-xs font-bold text-gray-400 uppercase">Total Produk</div>
                        <div class="text-2xl font-extrabold text-darktext">${products.length}</div>
                    </div>
                    <div class="bg-white p-6 rounded-3xl border border-softgray shadow-sm space-y-2">
                        <div class="text-xs font-bold text-gray-400 uppercase">Total Transaksi</div>
                        <div class="text-2xl font-extrabold text-darkgreen">Rp ${totalOmzet.toLocaleString('id-ID')}</div>
                    </div>
                </div>
            </div>`;
        }

        function attachAdminEvents() {}

        function logout() {
            setCurrentUser(null);
            currentView = 'login';
            showToast('Berhasil keluar akun.', 'info');
            renderApp();
        }

        // Run initial render on load
        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
